        g.clear(); g.fillStyle(0xff5500); g.fillRoundedRect(0, 0, 14, 6, 3); g.fillStyle(0xffffff); g.fillRoundedRect(2, 1, 8, 4, 2); g.generateTexture('enemy_bullet', 14, 6);

class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }

    create() {
        this.add.grid(400, 300, 800, 600, 50, 50, 0x1a1a1a, 1, 0x333333, 0.5);

        this.add.text(400, 200, 'รถถังโชกุน', { 
            fontFamily: '"Kanit", sans-serif', 
            fontSize: '85px', 
            fill: '#00ff00', 
            stroke: '#000', 
            strokeThickness: 8 
        }).setOrigin(0.5);

        this.add.text(400, 300, 'ศึกทะลวงด่านประจัญบาน', { 
            fontFamily: '"Kanit", sans-serif', 
            fontSize: '32px', 
            fill: '#fff', 
            stroke: '#000', 
            strokeThickness: 4 
        }).setOrigin(0.5);

        let startBtn = this.add.text(400, 450, '- คลิกหน้าจอเพื่อเริ่มเกม -', { 
            fontFamily: '"Kanit", sans-serif', 
            fontSize: '28px', 
            fill: '#ffff00', 
            stroke: '#000', 
            strokeThickness: 4 
        }).setOrigin(0.5);

        this.tweens.add({
            targets: startBtn,
            alpha: 0.1,
            yoyo: true,
            repeat: -1,
            duration: 800
        });

        this.input.once('pointerdown', () => {
            this.scene.start('Level1');
        });
    }
}

class BaseLevel extends Phaser.Scene {
    constructor(key) { super(key); }

    initData(levelNum, theme, mapLayout, enemyCount, enemySpeed, enemyFireRate, nextLevel) {
        this.levelNum = levelNum;
        this.theme = theme; 
        this.mapLayout = mapLayout;
        this.targetScore = enemyCount;
        this.enemySpeed = enemySpeed;
        this.enemyFireRate = enemyFireRate;
        this.nextLevel = nextLevel;
    }

    create() {
        this.isGameOver = false;
        this.enemiesKilled = 0;
        this.playerHP = 3;
        this.heartIcons = [];

        let bgColor, gridColor;
        if (this.theme === 'forest') { bgColor = 0x2d4c1e; gridColor = 0x1a3310; this.obstacleKey = 'tree'; }
        else if (this.theme === 'desert') { bgColor = 0xd2b48c; gridColor = 0xb09571; this.obstacleKey = 'cactus'; }
        else if (this.theme === 'winter') { bgColor = 0xe0f2fe; gridColor = 0xbddbf2; this.obstacleKey = 'snowman'; }

        this.add.grid(400, 300, 800, 600, 50, 50, bgColor, 1, gridColor, 0.5);

        this.walls = this.physics.add.staticGroup();
        this.obstacles = this.physics.add.staticGroup();
        this.items = this.physics.add.staticGroup(); 
        this.enemies = this.physics.add.group();
        
        this.player = this.physics.add.image(0, 0, 'tank_player');
        this.player.setCollideWorldBounds(true);
        this.player.setDepth(10);

        this.buildMap();

        this.uiText = this.add.text(20, 15, '', { fontFamily: '"Kanit", sans-serif', fontSize: '22px', fill: '#fff', stroke: '#000', strokeThickness: 5 });
        this.uiText.setDepth(20);
        this.updateUI();

        this.bullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 15, runChildUpdate: true });
        this.enemyBullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 30, runChildUpdate: true });
        this.cursors = this.input.keyboard.addKeys({ W: 87, A: 65, S: 83, D: 68 });

        this.input.on('pointerdown', (pointer) => {
            if (this.isGameOver) this.scene.restart();
            else this.shoot(pointer);
        });

        let blockers = [this.walls, this.obstacles];
        this.physics.add.collider(this.player, blockers);
        this.physics.add.collider(this.enemies, blockers);
        this.physics.add.collider(this.enemies, this.enemies);
        this.physics.add.collider(this.bullets, blockers, this.hitWall, null, this);
        this.physics.add.collider(this.enemyBullets, blockers, this.hitWall, null, this);
        this.physics.add.overlap(this.bullets, this.enemies, this.hitEnemy, null, this);
        this.physics.add.overlap(this.enemyBullets, this.player, this.hitPlayer, null, this);
        this.physics.add.overlap(this.player, this.items, this.collectItem, null, this);

        this.enemyShootTimer = this.time.addEvent({ delay: this.enemyFireRate, callback: this.enemyShoot, callbackScope: this, loop: true });
    }

    buildMap() {
        const tileSize = 50;
        for (let row = 0; row < this.mapLayout.length; row++) {
            for (let col = 0; col < this.mapLayout[row].length; col++) {
                let char = this.mapLayout[row][col];
                let x = col * tileSize + (tileSize / 2);
                let y = row * tileSize + (tileSize / 2);

                if (char === 'W') this.walls.create(x, y, 'wall_normal');
                else if (char === 'O') {
                    let obs = this.obstacles.create(x, y, this.obstacleKey);
                    obs.body.setSize(35, 35);
                }
                else if (char === 'P') this.player.setPosition(x, y);
                else if (char === 'E') {
                    let enemy = this.enemies.create(x, y, 'tank_enemy');
                    enemy.setCollideWorldBounds(true); enemy.setBounce(1);
                    enemy.setVelocity(Phaser.Math.Between(-this.enemySpeed, this.enemySpeed), Phaser.Math.Between(-this.enemySpeed, this.enemySpeed));
                }
                else if (char === 'B') {
                    let boss = this.enemies.create(x, y, 'tank_boss');
                    boss.setCollideWorldBounds(true); boss.setBounce(1);
                    boss.setVelocity(Phaser.Math.Between(-80, 80), Phaser.Math.Between(-80, 80));
                    boss.setData('isBoss', true); boss.setData('hp', 10);
                }
                else if (char === 'H') this.items.create(x, y, 'medkit');
            }
        }
    }

    update() {
        if (this.isGameOver) return;
        this.player.setVelocity(0);
        if (this.cursors.W.isDown) this.player.setVelocityY(-200); else if (this.cursors.S.isDown) this.player.setVelocityY(200);
        if (this.cursors.A.isDown) this.player.setVelocityX(-200); else if (this.cursors.D.isDown) this.player.setVelocityX(200);
        let angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, this.input.x, this.input.y);
        this.player.setRotation(angle);

        this.enemies.children.iterate((enemy) => {
            if(enemy && enemy.active) enemy.setRotation(Math.atan2(enemy.body.velocity.y, enemy.body.velocity.x));
        });
    }

    updateUI() {
        let totalScore = this.registry.get('totalScore');
        let themeName = this.theme === 'forest' ? 'ป่าไม้' : (this.theme === 'desert' ? 'ทะเลทราย' : 'ฤดูหนาว');
        
        // เพิ่มชื่อเกม รถถังโชกุน นำหน้าไว้ตรงนี้
        this.uiText.setText(`รถถังโชกุน | ด่าน ${this.levelNum} (${themeName}) | คะแนนรวม ${totalScore} | พลังชีวิต `);
        
        this.heartIcons.forEach(h => h.destroy());
        this.heartIcons = [];
        let startX = this.uiText.x + this.uiText.width + 10;
        for(let i=0; i<this.playerHP; i++) {
            let heart = this.add.image(startX + (i * 30), 28, 'heart');
            heart.setDepth(20);
            this.heartIcons.push(heart);
        }
    }

    shoot(pointer) {
        if (this.isGameOver || !this.player.active) return;
        let bullet = this.bullets.get(this.player.x, this.player.y, 'bullet');
        if (bullet) {
            try { this.sound.play('shoot', { volume: 0.3 }); } catch(e){}
            bullet.setActive(true).setVisible(true); bullet.enableBody(true, this.player.x, this.player.y, true, true);
            let angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, pointer.x, pointer.y);
            bullet.setRotation(angle); bullet.x += Math.cos(angle) * 35; bullet.y += Math.sin(angle) * 35;
            this.physics.velocityFromRotation(angle, 700, bullet.body.velocity);
        }
    }

    enemyShoot() {
        if (this.isGameOver || !this.player.active) return;
        this.enemies.children.iterate((enemy) => {
            if (enemy.active) {
                let distance = Phaser.Math.Distance.Between(enemy.x, enemy.y, this.player.x, this.player.y);
                if(distance < 500) { 
                    let bullet = this.enemyBullets.get(enemy.x, enemy.y, 'enemy_bullet');
                    if (bullet) {
                        try { this.sound.play('shoot', { volume: 0.1 }); } catch(e){}
                        bullet.setActive(true).setVisible(true); bullet.enableBody(true, enemy.x, enemy.y, true, true);
                        let angle = Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player.y);
                        bullet.setRotation(angle); bullet.x += Math.cos(angle) * 35; bullet.y += Math.sin(angle) * 35;
                        this.physics.velocityFromRotation(angle, 400, bullet.body.velocity);
                    }
                }
            }
        });
    }

    createExplosion(x, y, color, size = 1.5) {
        let emitter = this.add.particles(x, y, 'particle', {
            speed: { min: 80, max: 250 }, angle: { min: 0, max: 360 }, scale: { start: size, end: 0 }, lifespan: 600, quantity: 20, tint: color, blendMode: 'ADD'
        });
        emitter.explode();
    }

    hitWall(bullet, wall) {
        this.createExplosion(bullet.x, bullet.y, 0xaaaaaa, 1);
        bullet.disableBody(true, true);
    }

    hitEnemy(bullet, enemy) {
        bullet.disableBody(true, true);

        let isBoss = enemy.getData('isBoss');
        if (isBoss) {
            let hp = enemy.getData('hp') - 1;
            enemy.setData('hp', hp);
            enemy.setTint(0xffffff);
            this.time.delayedCall(100, () => { enemy.clearTint(); });
            
            if (hp > 0) {
                try { this.sound.play('explode', { volume: 0.2 }); } catch(e){}
                this.createExplosion(bullet.x, bullet.y, 0xffaa00, 1);
                return; 
            }
        }

        try { this.sound.play('explode', { volume: 0.6 }); } catch(e){}
        this.createExplosion(enemy.x, enemy.y, isBoss ? 0xcc00ff : 0xff3300, isBoss ? 3 : 1.5);
        enemy.disableBody(true, true);
        
        this.enemiesKilled++;
        this.registry.set('totalScore', this.registry.get('totalScore') + (isBoss ? 500 : 100));
        this.updateUI();

        if (this.enemiesKilled >= this.targetScore) this.endLevel(true);
    }

    hitPlayer(player, bullet) {
        try { this.sound.play('explode', { volume: 0.5 }); } catch(e){}
        this.createExplosion(player.x, player.y, 0xffaa00);
        bullet.disableBody(true, true);
        
        this.playerHP--;
        this.updateUI();

        this.player.setTint(0xff0000);
        this.time.delayedCall(150, () => { this.player.clearTint(); });

        if (this.playerHP <= 0) {
            this.createExplosion(player.x, player.y, 0x00ff00, 2);
            player.disableBody(true, true);
            this.endLevel(false);
        }
    }

    collectItem(player, item) {
        try { this.sound.play('pickup', { volume: 0.6 }); } catch(e){}
        item.destroy(); 
        if(this.playerHP < 5) this.playerHP++;
        this.updateUI();
        this.createExplosion(item.x, item.y, 0x00ff00);
    }

    endLevel(isWin) {
        this.isGameOver = true;
        this.enemyShootTimer.remove();
        this.physics.pause();
        let textStyle = { fontFamily: '"Kanit", sans-serif', fontSize: '48px', fill: '#0f0', align: 'center', stroke: '#000', strokeThickness: 6 };

        if (isWin) {
            if (this.nextLevel) {
                this.add.text(400, 300, 'ผ่านด่านแล้ว\nคลิกเพื่อไปด่านถัดไป', textStyle).setOrigin(0.5);
                this.input.once('pointerdown', () => { this.scene.start(this.nextLevel); });
            } else {
                textStyle.fill = '#ff0';
                this.add.text(400, 300, 'ปราบสมุนและบอสสำเร็จ!\nคุณคือแชมเปี้ยน', textStyle).setOrigin(0.5);
            }
        } else {
            textStyle.fill = '#f00';
            this.add.text(400, 300, 'จบเกม\nคลิกเพื่อกลับไปเมนูหลัก', textStyle).setOrigin(0.5);
            this.input.once('pointerdown', () => { 
                this.registry.set('totalScore', 0);
                this.scene.start('MainMenu'); 
            });
        }
    }
}

const config = {
    type: Phaser.AUTO, width: 800, height: 600,
