<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>รถถังโชกุน - Ultra Graphics Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        body { margin: 0; background-color: #0d0d0d; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Kanit', sans-serif; }
        canvas { box-shadow: 0 15px 50px rgba(0,255,100,0.2); border-radius: 12px; border: 2px solid #222; }
    </style>
</head>
<body>
<script>
const LEVELS = [
    { name: 'ป่าไม้', bgColor: 0x334d28, gridColor: 0x25381d, obsKey: 'tree', enemies: 4, speed: 100, boss: false },
    { name: 'ทะเลทราย', bgColor: 0xc49d68, gridColor: 0xa88556, obsKey: 'cactus', enemies: 5, speed: 110, boss: false },
    { name: 'ฤดูหนาว', bgColor: 0xcde5f7, gridColor: 0xb0cbe0, obsKey: 'snowman', enemies: 6, speed: 120, boss: false },
    { name: 'ภูเขาไฟ', bgColor: 0x471d1d, gridColor: 0x301313, obsKey: 'wall_normal', enemies: 7, speed: 130, boss: false },
    { name: 'ฐานทัพบอส 1', bgColor: 0x1f1f1f, gridColor: 0x141414, obsKey: 'wall_normal', enemies: 4, speed: 140, boss: true },
    { name: 'พายุฝน', bgColor: 0x344352, gridColor: 0x24303d, obsKey: 'tree', enemies: 7, speed: 130, boss: false },
    { name: 'หุบเขา', bgColor: 0x5e5345, gridColor: 0x473f34, obsKey: 'cactus', enemies: 8, speed: 140, boss: false },
    { name: 'เมืองร้าง', bgColor: 0x3b3b3b, gridColor: 0x262626, obsKey: 'wall_normal', enemies: 9, speed: 150, boss: false },
    { name: 'หนองน้ำมรณะ', bgColor: 0x1b3022, gridColor: 0x101c13, obsKey: 'tree', enemies: 10, speed: 160, boss: false },
    { name: 'รังบอสใหญ่', bgColor: 0x170b24, gridColor: 0x0c0614, obsKey: 'wall_normal', enemies: 6, speed: 150, boss: true }
];

const DEFAULT_MAP = [
    'WWWWWWWWWWWWWWWW',
    'W..H....O......W',
    'W..WWW....WWW..W',
    'W......O.......W',
    'W..............W',
    'W..O....P...O..W',
    'W..............W',
    'W......O.......W',
    'W..WWW....WWW..W',
    'W......O....H..W',
    'W..............W',
    'WWWWWWWWWWWWWWWW'
];

class BootScene extends Phaser.Scene {
    constructor() { super('Boot'); }
    preload() {
        this.load.audio('shoot', 'https://labs.phaser.io/assets/audio/SoundEffects/blaster.mp3');
        this.load.audio('explode', 'https://labs.phaser.io/assets/audio/SoundEffects/explosion.mp3');
        this.load.audio('pickup', 'https://labs.phaser.io/assets/audio/SoundEffects/pickup.mp3');
    }
    
    create() {
        if(!localStorage.getItem('tankKeys')) {
            localStorage.setItem('tankKeys', JSON.stringify({ up: 87, down: 83, left: 65, right: 68, shoot: 32 })); 
        }
        
        let g = this.add.graphics();
        
        // รถถังผู้เล่น
        g.clear();
        g.fillStyle(0x000000, 0.4); g.fillRoundedRect(8, 5, 48, 40, 5);
        g.fillStyle(0x1a1a1a); g.fillRoundedRect(5, 2, 40, 12, 3); g.fillRoundedRect(5, 26, 40, 12, 3);
        g.lineStyle(2, 0x0a0a0a); for(let i=8; i<45; i+=5){ g.lineBetween(i,2,i,14); g.lineBetween(i,26,i,38); }
        g.fillStyle(0x1b4016); g.fillRoundedRect(12, 6, 34, 28, 4);
        g.fillStyle(0x2e6126); g.fillRoundedRect(14, 8, 30, 24, 3);
        g.lineStyle(1, 0x1b4016); g.strokeRoundedRect(16, 10, 26, 20, 2);
        g.fillStyle(0x1b4016); g.fillCircle(24, 20, 14);
        g.fillStyle(0x3e7a35); g.fillCircle(24, 20, 12);
        g.fillStyle(0x111111); g.fillRect(24, 17, 36, 6);
        g.fillStyle(0x555555); g.fillRect(28, 18, 30, 2);
        g.fillStyle(0x222222); g.fillRoundedRect(56, 14, 10, 12, 2);
        g.generateTexture('tank_player', 70, 44);

        // รถถังศัตรู
        g.clear();
        g.fillStyle(0x000000, 0.4); g.fillRoundedRect(8, 5, 48, 40, 5); 
        g.fillStyle(0x1a1a1a); g.fillRoundedRect(5, 2, 40, 12, 3); g.fillRoundedRect(5, 26, 40, 12, 3);
        g.lineStyle(2, 0x0a0a0a); for(let i=8; i<45; i+=5){ g.lineBetween(i,2,i,14); g.lineBetween(i,26,i,38); }
        g.fillStyle(0x591515); g.fillRoundedRect(12, 6, 34, 28, 4); 
        g.fillStyle(0x8a2525); g.fillRoundedRect(14, 8, 30, 24, 3);
        g.fillStyle(0x591515); g.fillCircle(24, 20, 14);
        g.fillStyle(0xbd3131); g.fillCircle(24, 20, 12);
        g.fillStyle(0x111111); g.fillRect(24, 17, 36, 6);
        g.fillStyle(0x555555); g.fillRect(28, 18, 30, 2);
        g.fillStyle(0x222222); g.fillRoundedRect(56, 14, 10, 12, 2);
        g.generateTexture('tank_enemy', 70, 44);

        // รถถังบอส
        g.clear();
        g.fillStyle(0x000000, 0.5); g.fillRoundedRect(10, 5, 75, 50, 6);
        g.fillStyle(0x1a1a1a); g.fillRoundedRect(5, 2, 60, 16, 4); g.fillRoundedRect(5, 42, 60, 16, 4);
        g.lineStyle(2, 0x0a0a0a); for(let i=10; i<65; i+=6){ g.lineBetween(i,2,i,18); g.lineBetween(i,42,i,58); }
        g.fillStyle(0x221245); g.fillRoundedRect(15, 12, 50, 36, 5); 
        g.fillStyle(0x371e6b); g.fillRoundedRect(18, 15, 44, 30, 4);
        g.fillStyle(0x15092e); g.fillCircle(35, 30, 22);
        g.fillStyle(0x4c2a91); g.fillCircle(35, 30, 18);
        g.fillStyle(0x111111); g.fillRect(35, 25, 50, 10);
        g.fillStyle(0x666666); g.fillRect(40, 27, 40, 3);
        g.fillStyle(0x111111); g.fillRoundedRect(80, 21, 14, 18, 3);
        g.generateTexture('tank_boss', 95, 60);
        
        // สิ่งกีดขวาง (วาดที่ขนาด 50x50 พอดีเป๊ะ)
        g.clear(); g.fillStyle(0x000000, 0.4); g.fillRect(2, 2, 48, 48); g.fillStyle(0x4a4a4a); g.fillRect(0, 0, 50, 50); g.fillStyle(0x555555); g.fillRect(2, 2, 46, 46); g.lineStyle(2, 0x222222); g.strokeRect(0, 0, 50, 50); g.generateTexture('wall_normal', 50, 50);
        g.clear(); g.fillStyle(0x000000, 0.4); g.fillCircle(27, 27, 22); g.fillStyle(0x1a4314); g.fillCircle(25, 25, 22); g.fillStyle(0x255c1d); g.fillCircle(23, 23, 16); g.generateTexture('tree', 50, 50);
        g.clear(); g.fillStyle(0x000000, 0.4); g.fillRoundedRect(17, 7, 20, 40, 10); g.fillStyle(0x28681e); g.fillRoundedRect(15, 5, 20, 40, 10); g.generateTexture('cactus', 50, 50);
        g.clear(); g.fillStyle(0x000000, 0.4); g.fillCircle(27, 37, 15); g.fillStyle(0xeeeeee); g.fillCircle(25, 35, 15); g.fillCircle(25, 15, 10); g.generateTexture('snowman', 50, 50);
        
        g.clear(); g.fillStyle(0xdddddd); g.fillRoundedRect(0, 0, 26, 26, 4); g.fillStyle(0xffffff); g.fillRoundedRect(2, 2, 22, 22, 2); g.fillStyle(0xcc0000); g.fillRect(10, 4, 6, 18); g.fillRect(4, 10, 18, 6); g.generateTexture('medkit', 26, 26);
        g.clear(); g.fillStyle(0xffffcc); g.fillRoundedRect(0, 0, 16, 6, 3); g.fillStyle(0xffaa00); g.strokeRoundedRect(0, 0, 16, 6, 3); g.generateTexture('bullet', 16, 6);
        g.clear(); g.fillStyle(0xffcccc); g.fillRoundedRect(0, 0, 16, 6, 3); g.fillStyle(0xff3300); g.strokeRoundedRect(0, 0, 16, 6, 3); g.generateTexture('enemy_bullet', 16, 6);
        g.clear(); g.fillStyle(0xffaa00); g.fillCircle(4, 4, 4); g.generateTexture('particle', 8, 8);
        g.clear(); g.fillStyle(0xff2222); g.fillCircle(10, 10, 6); g.fillCircle(20, 10, 6); g.fillTriangle(4, 12, 26, 12, 15, 25); g.generateTexture('heart', 30, 30);

        this.scene.start('MainMenu');
    }
}

class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
        this.add.grid(400, 300, 800, 600, 50, 50, 0x111111, 1, 0x222222, 0.5);
        this.add.text(400, 150, 'รถถังโชกุน', { fontFamily: 'Kanit', fontSize: '80px', fill: '#00ff66', stroke: '#003311', strokeThickness: 10, shadow: { offsetX: 3, offsetY: 3, color: '#000', blur: 10, fill: true } }).setOrigin(0.5);
        
        this.createButton(400, 300, '▶ เริ่มเกมใหม่', () => {
            this.registry.set('totalScore', 0);
            this.scene.start('GameLevel', { level: 1, hp: 3 });
        });

        if (localStorage.getItem('shogunTankSave')) {
            this.createButton(400, 400, '💾 เล่นต่อจากด่านที่เซฟ', () => {
                let save = JSON.parse(localStorage.getItem('shogunTankSave'));
                this.registry.set('totalScore', save.score);
                this.scene.start('GameLevel', { level: save.level, hp: save.hp });
            });
        }

        this.createButton(400, 500, '⚙️ ตั้งค่าปุ่มควบคุม', () => this.scene.start('SettingsMenu'));
    }

    createButton(x, y, text, callback) {
        let btn = this.add.text(x, y, text, { fontFamily: 'Kanit', fontSize: '30px', fill: '#fff', backgroundColor: '#1a1a1a', padding: { x: 25, y: 12 } }).setOrigin(0.5).setInteractive();
        btn.setStroke('#444', 3);
        btn.on('pointerover', () => { btn.setStyle({ fill: '#00ff66', backgroundColor: '#2a2a2a' }); this.tweens.add({ targets: btn, scale: 1.1, duration: 100 }); });
        btn.on('pointerout', () => { btn.setStyle({ fill: '#fff', backgroundColor: '#1a1a1a' }); this.tweens.add({ targets: btn, scale: 1, duration: 100 }); });
        btn.on('pointerdown', callback);
        return btn;
    }
}

class SettingsMenu extends Phaser.Scene {
    constructor() { super('SettingsMenu'); }
    create() {
        this.keys = JSON.parse(localStorage.getItem('tankKeys'));
        this.add.grid(400, 300, 800, 600, 50, 50, 0x111111, 1, 0x222222, 0.5);
        this.add.text(400, 80, 'ตั้งค่าปุ่มควบคุม', { fontFamily: 'Kanit', fontSize: '40px', fill: '#fff', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5);

        this.createKeySet(180, 'เดินขึ้น', 'up');
        this.createKeySet(260, 'เดินลง', 'down');
        this.createKeySet(340, 'เดินซ้าย', 'left');
        this.createKeySet(420, 'เดินขวา', 'right');
        this.createKeySet(500, 'ยิงปืน', 'shoot');

        let backBtn = this.add.text(400, 580, '✔ บันทึกและกลับ', { fontFamily: 'Kanit', fontSize: '26px', fill: '#00ff66', backgroundColor: '#222', padding: {x:20, y:10} }).setOrigin(0.5).setInteractive();
        backBtn.on('pointerdown', () => {
            localStorage.setItem('tankKeys', JSON.stringify(this.keys));
            this.scene.start('MainMenu');
        });
    }

    createKeySet(y, label, keyName) {
        this.add.text(320, y, label, { fontFamily: 'Kanit', fontSize: '28px', fill: '#ccc' }).setOrigin(1, 0.5);
        let btn = this.add.text(420, y, this.getKeyChar(this.keys[keyName]), { fontFamily: 'Kanit', fontSize: '26px', fill: '#fff', backgroundColor: '#333', padding: {x:25, y:8} }).setOrigin(0, 0.5).setInteractive();
        btn.setStroke('#555', 2);
        
        btn.on('pointerdown', () => {
            btn.setText('กดปุ่มที่ต้องการ...');
            btn.setStyle({ fill: '#ff0' });
            this.input.keyboard.once('keydown', (event) => {
                this.keys[keyName] = event.keyCode;
                btn.setText(this.getKeyChar(event.keyCode));
                btn.setStyle({ fill: '#fff' });
                localStorage.setItem('tankKeys', JSON.stringify(this.keys));
            });
        });
    }

    getKeyChar(keyCode) {
        if (keyCode === 32) return 'SPACE';
        if (keyCode === 37) return '◀ LEFT';
        if (keyCode === 38) return '▲ UP';
        if (keyCode === 39) return '▶ RIGHT';
        if (keyCode === 40) return '▼ DOWN';
        return String.fromCharCode(keyCode);
    }
}

class GameLevel extends Phaser.Scene {
    constructor() { super('GameLevel'); }

    init(data) {
        this.levelNum = data.level || 1;
        this.playerHP = data.hp || 3;
        this.levelData = LEVELS[this.levelNum - 1];
    }

    create() {
        this.isGameOver = false;
        this.enemiesKilled = 0;
        this.customKeys = JSON.parse(localStorage.getItem('tankKeys')) || { up: 87, down: 83, left: 65, right: 68, shoot: 32 };

        this.add.grid(400, 300, 800, 600, 50, 50, this.levelData.bgColor, 1, this.levelData.gridColor, 0.6);

        this.walls = this.physics.add.staticGroup();
        this.obstacles = this.physics.add.staticGroup();
        this.items = this.physics.add.staticGroup(); 
        this.enemies = this.physics.add.group();
        
        // ผู้เล่น (ปรับขนาดสเกลลง 65% ให้ตัวเล็กลง วิ่งในช่อง 50x50 ได้สบายๆ)
        this.player = this.physics.add.image(0, 0, 'tank_player');
        this.player.setCollideWorldBounds(true).setDepth(10);
        this.player.setScale(0.65); // สำคัญมาก! แก้บั๊กเดินติด
        this.player.body.setSize(44, 44); // บังคับขนาดกล่องให้หลวมๆ 
        this.player.setAngle(-90); 

        this.buildMap();

        this.uiText = this.add.text(20, 15, '', { fontFamily: 'Kanit', fontSize: '24px', fill: '#fff', stroke: '#000', strokeThickness: 6, shadow: { offsetX: 2, offsetY: 2, color: '#000', fill: true } }).setDepth(20);
        this.heartIcons = [];
        this.updateUI();

        let saveBtn = this.add.text(780, 15, '💾 บันทึกเกม', { fontFamily: 'Kanit', fontSize: '20px', fill: '#fff', backgroundColor: '#005500', padding: {x: 12, y: 8}, stroke: '#000', strokeThickness: 3 }).setOrigin(1, 0).setInteractive().setDepth(20);
        saveBtn.on('pointerdown', () => this.saveGame());

        this.bullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 30, runChildUpdate: true });
        this.enemyBullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 50, runChildUpdate: true });
        
        this.input.keyboard.on(`keydown-${this.customKeys.shoot}`, () => this.shoot());
        this.input.keyboard.on('keydown-SPACE', () => this.shoot()); 
        this.input.on('pointerdown', () => this.shoot());

        let blockers = [this.walls, this.obstacles];
        this.physics.add.collider(this.player, blockers);
        this.physics.add.collider(this.enemies, blockers);
        this.physics.add.collider(this.enemies, this.enemies);
        this.physics.add.collider(this.bullets, blockers, this.hitWall, null, this);
        this.physics.add.collider(this.enemyBullets, blockers, this.hitWall, null, this);
        this.physics.add.overlap(this.bullets, this.enemies, this.hitEnemy, null, this);
        this.physics.add.overlap(this.enemyBullets, this.player, this.hitPlayer, null, this);
        this.physics.add.overlap(this.player, this.items, this.collectItem, null, this);

        this.time.addEvent({ delay: 1200, callback: this.processEnemyAI, callbackScope: this, loop: true });
    }

    buildMap() {
        let emptySpaces = []; 

        for (let row = 0; row < DEFAULT_MAP.length; row++) {
            for (let col = 0; col < DEFAULT_MAP[row].length; col++) {
                let char = DEFAULT_MAP[row][col];
                let x = col * 50 + 25; let y = row * 50 + 25;
                
                if (char === 'W') {
                    this.walls.create(x, y, 'wall_normal').setSize(50, 50); // กำหนดขนาดกำแพงให้เป๊ะ
                } else if (char === 'O') {
                    // กำหนดขนาดสิ่งกีดขวางให้เล็กกว่าช่องนิดหน่อย (40x40) เพื่อให้ขับเบียดๆ ผ่านไปได้
                    this.obstacles.create(x, y, this.levelData.obsKey).setSize(40, 40);
                } else if (char === 'H') {
                    this.items.create(x, y, 'medkit');
                } else if (char === 'P') {
                    this.player.setPosition(x, y);
                } else if (char === '.') {
                    emptySpaces.push({x: x, y: y});
                }
            }
        }

        Phaser.Utils.Array.Shuffle(emptySpaces);

        for(let i=0; i<this.levelData.enemies; i++) {
            let spawnPt = emptySpaces[i % emptySpaces.length];
            let enemy = this.enemies.create(spawnPt.x, spawnPt.y, 'tank_enemy');
            enemy.setCollideWorldBounds(true).setBounce(0.8); // ลดแรงเด้งเพื่อป้องกันการทะลุกำแพง
            enemy.setScale(0.65); // ย่อขนาดเหมือนผู้เล่น
            enemy.body.setSize(44, 44);
            enemy.setAngle(Phaser.Math.Between(0, 3) * 90);
            this.physics.velocityFromRotation(enemy.rotation, this.levelData.speed, enemy.body.velocity);
        }

        if (this.levelData.boss) {
            let boss = this.enemies.create(425, 75, 'tank_boss'); 
            boss.setCollideWorldBounds(true).setBounce(0.8);
            boss.setScale(0.7); // ย่อบอสให้พอดีฉาก
            boss.body.setSize(60, 60);
            boss.setData('isBoss', true); boss.setData('hp', 15);
            boss.setAngle(Phaser.Math.Between(0, 3) * 90);
            this.physics.velocityFromRotation(boss.rotation, this.levelData.speed, boss.body.velocity);
        }
    }

    update() {
        if (this.isGameOver || !this.player.active) return;
        this.player.setVelocity(0);
        let k = this.customKeys;
        let isUp = this.input.keyboard.addKey(k.up).isDown || this.input.keyboard.addKey(38).isDown;
        let isDown = this.input.keyboard.addKey(k.down).isDown || this.input.keyboard.addKey(40).isDown;
        let isLeft = this.input.keyboard.addKey(k.left).isDown || this.input.keyboard.addKey(37).isDown;
        let isRight = this.input.keyboard.addKey(k.right).isDown || this.input.keyboard.addKey(39).isDown;

        if (isUp) { this.player.setVelocityY(-200); this.player.setAngle(-90); }
        else if (isDown) { this.player.setVelocityY(200); this.player.setAngle(90); }
        else if (isLeft) { this.player.setVelocityX(-200); this.player.setAngle(180); }
        else if (isRight) { this.player.setVelocityX(200); this.player.setAngle(0); }
    }

    updateUI() {
        let totalScore = this.registry.get('totalScore') || 0;
        this.uiText.setText(`ด่าน ${this.levelNum}/10 (${this.levelData.name}) | คะแนน: ${totalScore} | พลังชีวิต `);
        this.heartIcons.forEach(h => h.destroy());
        this.heartIcons = [];
        let startX = this.uiText.x + this.uiText.width + 5;
        for(let i=0; i<this.playerHP; i++) {
            this.heartIcons.push(this.add.image(startX + (i * 28), 30, 'heart').setDepth(20));
        }
    }

    shoot() {
        if (this.isGameOver || !this.player.active) return;
        let bullet = this.bullets.get(this.player.x, this.player.y, 'bullet');
        if (bullet) {
            try { this.sound.play('shoot', { volume: 0.4 }); } catch(e){}
            this.cameras.main.shake(80, 0.005); 
            bullet.setActive(true).setVisible(true).enableBody(true, this.player.x, this.player.y, true, true);
            let angle = this.player.rotation; 
            bullet.setRotation(angle); 
            // ระยะปล่อยกระสุนถูกปรับให้ตรงกับสเกลตัวรถถัง
            bullet.x += Math.cos(angle) * 30; bullet.y += Math.sin(angle) * 30;
            this.physics.velocityFromRotation(angle, 700, bullet.body.velocity);
            this.time.delayedCall(1500, () => { if(bullet.active) bullet.disableBody(true, true); });
        }
    }

    processEnemyAI() {
        if (this.isGameOver || !this.player.active) return;
        this.enemies.children.iterate((enemy) => {
            if (enemy && enemy.active) {
                let distance = Phaser.Math.Distance.Between(enemy.x, enemy.y, this.player.x, this.player.y);
                if(distance < 450 && Phaser.Math.Between(0, 100) > 60) {
                    let angleToPlayer = Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player.y);
                    let snapAngle = Math.round(angleToPlayer / (Math.PI/2)) * (Math.PI/2);
                    enemy.setRotation(snapAngle);
                    enemy.setVelocity(0); 
                    
                    let bullet = this.enemyBullets.get(enemy.x, enemy.y, 'enemy_bullet');
                    if (bullet) {
                        try { this.sound.play('shoot', { volume: 0.2 }); } catch(e){}
                        bullet.setActive(true).setVisible(true).enableBody(true, enemy.x, enemy.y, true, true);
                        bullet.setRotation(snapAngle); 
                        bullet.x += Math.cos(snapAngle) * 30; bullet.y += Math.sin(snapAngle) * 30;
                        this.physics.velocityFromRotation(snapAngle, 400, bullet.body.velocity);
                        this.time.delayedCall(1500, () => { if(bullet.active) bullet.disableBody(true, true); });
                    }
                    this.time.delayedCall(300, () => {
                        let escapeDir = Phaser.Math.Between(0, 3) * (Math.PI/2);
                        enemy.setRotation(escapeDir);
                        this.physics.velocityFromRotation(escapeDir, this.levelData.speed, enemy.body.velocity);
                    });
                } else {
                    let dir = Phaser.Math.Between(0, 3) * (Math.PI/2);
                    enemy.setRotation(dir);
                    this.physics.velocityFromRotation(dir, this.levelData.speed, enemy.body.velocity);
                }
            }
        });
    }

    createExplosion(x, y, color, size = 1.5) {
        let emitter = this.add.particles(x, y, 'particle', { 
            speed: { min: 100, max: 300 }, scale: { start: size, end: 0 }, 
            lifespan: 800, quantity: 25, tint: color, blendMode: 'ADD', 
            gravityY: 100 
        });
        emitter.explode();
    }

    hitWall(bullet, wall) {
        this.createExplosion(bullet.x, bullet.y, 0xaaaaaa, 0.8);
        bullet.disableBody(true, true);
    }

    hitEnemy(bullet, enemy) {
        bullet.disableBody(true, true);
        let isBoss = enemy.getData('isBoss');
        if (isBoss) {
            let hp = enemy.getData('hp') - 1;
            enemy.setData('hp', hp);
            enemy.setTint(0xffffff); this.time.delayedCall(80, () => enemy.clearTint());
            if (hp > 0) {
                try { this.sound.play('explode', { volume: 0.3 }); } catch(e){}
                this.createExplosion(bullet.x, bullet.y, 0xffdd00, 1.2);
                return; 
            }
        }

        try { this.sound.play('explode', { volume: 0.7 }); } catch(e){}
        this.cameras.main.shake(150, isBoss ? 0.02 : 0.01); 
        this.createExplosion(enemy.x, enemy.y, isBoss ? 0xcc00ff : 0xff5500, isBoss ? 4 : 2);
        enemy.disableBody(true, true);
        
        this.enemiesKilled++;
        this.registry.set('totalScore', (this.registry.get('totalScore') || 0) + (isBoss ? 500 : 100));
        this.updateUI();

        if (this.enemiesKilled >= this.levelData.enemies + (this.levelData.boss ? 1 : 0)) {
            this.showOverlay(true);
        }
    }

    hitPlayer(player, bullet) {
        try { this.sound.play('explode', { volume: 0.8 }); } catch(e){}
        this.cameras.main.shake(200, 0.02);
        this.createExplosion(player.x, player.y, 0xff3300, 2);
        bullet.disableBody(true, true);
        
        this.playerHP--;
        this.updateUI();
        this.player.setTint(0xff0000); this.time.delayedCall(150, () => this.player.clearTint());

        if (this.playerHP <= 0) {
            this.createExplosion(player.x, player.y, 0x00ffaa, 3);
            player.disableBody(true, true);
            this.showOverlay(false);
        }
    }

    collectItem(player, item) {
        try { this.sound.play('pickup', { volume: 0.8 }); } catch(e){}
        item.destroy(); 
        if(this.playerHP < 5) this.playerHP++;
        this.updateUI();
        this.createExplosion(item.x, item.y, 0x00ff00, 1.5);
    }

    saveGame() {
        localStorage.setItem('shogunTankSave', JSON.stringify({ level: this.levelNum, hp: this.playerHP, score: this.registry.get('totalScore') }));
        alert('💾 บันทึกเกมสำเร็จ! (ด่าน ' + this.levelNum + ')');
        this.scene.start('MainMenu');
    }

    showOverlay(isWin) {
        this.isGameOver = true;
        this.physics.pause();
        let bg = this.add.rectangle(400, 300, 800, 600, 0x000000, 0.8).setDepth(100);
        
        if (isWin) {
            if (this.levelNum < 10) {
                this.add.text(400, 230, '✨ STAGE CLEAR ✨', { fontFamily: 'Kanit', fontSize: '60px', fill: '#00ff66', stroke: '#000', strokeThickness: 8, shadow: { offsetX: 0, offsetY: 0, color: '#0f0', blur: 20, fill: true } }).setOrigin(0.5).setDepth(101);
                let nextBtn = this.add.text(400, 350, 'ลุยด่านถัดไป ➔', { fontFamily: 'Kanit', fontSize: '32px', fill: '#fff', backgroundColor: '#0066cc', padding: {x: 30, y: 12}, stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setInteractive().setDepth(101);
                nextBtn.on('pointerdown', () => this.scene.restart({ level: this.levelNum + 1, hp: this.playerHP }));
            } else {
                this.add.text(400, 230, '🏆 แชมเปี้ยนโชกุน! 🏆\nคุณเคลียร์เกมสำเร็จ', { fontFamily: 'Kanit', fontSize: '55px', fill: '#ffcc00', align: 'center', stroke: '#000', strokeThickness: 8, shadow: { offsetX: 0, offsetY: 0, color: '#ff0', blur: 20, fill: true } }).setOrigin(0.5).setDepth(101);
                let menuBtn = this.add.text(400, 380, 'กลับเมนูหลัก', { fontFamily: 'Kanit', fontSize: '30px', fill: '#fff', backgroundColor: '#444', padding: {x: 30, y: 12} }).setOrigin(0.5).setInteractive().setDepth(101);
                menuBtn.on('pointerdown', () => this.scene.start('MainMenu'));
            }
        } else {
            this.add.text(400, 230, '🔥 MISSION FAILED 🔥', { fontFamily: 'Kanit', fontSize: '60px', fill: '#ff3300', stroke: '#000', strokeThickness: 8, shadow: { offsetX: 0, offsetY: 0, color: '#f00', blur: 20, fill: true } }).setOrigin(0.5).setDepth(101);
            let retryBtn = this.add.text(400, 350, 'ลองใหม่อีกครั้ง ↻', { fontFamily: 'Kanit', fontSize: '32px', fill: '#fff', backgroundColor: '#990000', padding: {x: 30, y: 12}, stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setInteractive().setDepth(101);
            retryBtn.on('pointerdown', () => this.scene.restart({ level: this.levelNum, hp: 3 }));
            let menuBtn = this.add.text(400, 430, 'กลับเมนูหลัก', { fontFamily: 'Kanit', fontSize: '26px', fill: '#aaa' }).setOrigin(0.5).setInteractive().setDepth(101);
            menuBtn.on('pointerdown', () => this.scene.start('MainMenu'));
        }
    }
}

const config = {
    type: Phaser.AUTO,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 800, height: 600 },
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: [BootScene, MainMenu, SettingsMenu, GameLevel]
};
const game = new Phaser.Game(config);
</script>
</body>
</html>
