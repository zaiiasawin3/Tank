</head>

class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
        this.add.grid(400, 300, 800, 600, 50, 50, 0x1a1a1a, 1, 0x333333, 0.5);

        this.add.text(400, 200, 'รถถังโชกุน', { fontFamily: '"Kanit", sans-serif', fontSize: '85px', fill: '#00ff00', stroke: '#000', strokeThickness: 8 }).setOrigin(0.5);
        this.add.text(400, 300, 'ศึกทะลวงด่านประจัญบาน (10 ด่าน)', { fontFamily: '"Kanit", sans-serif', fontSize: '32px', fill: '#fff', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5);

        let startBtn = this.add.text(400, 420, '- เริ่มเกมใหม่ -', { fontFamily: '"Kanit", sans-serif', fontSize: '32px', fill: '#ffff00', backgroundColor: '#222', stroke: '#000', strokeThickness: 4, padding: { x: 20, y: 10 } }).setOrigin(0.5).setInteractive();
        startBtn.on('pointerover', () => startBtn.setBackgroundColor('#444'));
        startBtn.on('pointerout', () => startBtn.setBackgroundColor('#222'));
        startBtn.on('pointerdown', () => {
            this.registry.set('totalScore', 0);
            this.scene.start('DifficultyMenu');
        });

        let savedDataStr = localStorage.getItem('shogunTankSave');
        if (savedDataStr) {
            let savedData = JSON.parse(savedDataStr);
            let contBtn = this.add.text(400, 510, '- เล่นต่อจากที่บันทึก -', { fontFamily: '"Kanit", sans-serif', fontSize: '28px', fill: '#00ffff', backgroundColor: '#114444', stroke: '#000', strokeThickness: 4, padding: { x: 20, y: 10 } }).setOrigin(0.5).setInteractive();
            contBtn.on('pointerover', () => contBtn.setBackgroundColor('#226666'));
            contBtn.on('pointerout', () => contBtn.setBackgroundColor('#114444'));
            contBtn.on('pointerdown', () => {
                this.registry.set('totalScore', savedData.score || 0);
                this.registry.set('difficulty', savedData.difficulty || 'medium');
                this.scene.start(savedData.level);
            });
        }
    }
}

class DifficultyMenu extends Phaser.Scene {
    constructor() { super('DifficultyMenu'); }
    create() {
        this.add.grid(400, 300, 800, 600, 50, 50, 0x1a1a1a, 1, 0x333333, 0.5);
        this.add.text(400, 130, 'เลือกระดับความยาก', { fontFamily: '"Kanit", sans-serif', fontSize: '50px', fill: '#fff', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5);

        let makeBtn = (y, text, color, diffKey) => {
            let btn = this.add.text(400, y, text, { fontFamily: '"Kanit", sans-serif', fontSize: '36px', fill: color, backgroundColor: '#222', stroke: '#000', strokeThickness: 4, padding: { x: 30, y: 15 } }).setOrigin(0.5).setInteractive();
            btn.on('pointerover', () => btn.setBackgroundColor('#444'));
            btn.on('pointerout', () => btn.setBackgroundColor('#222'));
            btn.on('pointerdown', () => {
                this.registry.set('difficulty', diffKey);
                this.scene.start('Level1');
            });
        };
        makeBtn(260, 'ง่าย (Easy) - เลือด 5', '#00ff00', 'easy');
        makeBtn(370, 'ปานกลาง (Medium) - เลือด 3', '#ffff00', 'medium');
        makeBtn(480, 'ยาก (Hard) - เลือด 2', '#ff3333', 'hard');
    }
}

class BaseLevel extends Phaser.Scene {
    constructor(key) { super(key); }

    initData(levelNum, theme, mapLayout, enemyCount, enemySpeed, enemyFireRate, nextLevel) {
        this.levelNum = levelNum;
        this.theme = theme; 
        this.mapLayout = mapLayout;
        this.targetScore = enemyCount;
        this.baseEnemySpeed = enemySpeed;
        this.baseEnemyFireRate = enemyFireRate;
        this.nextLevel = nextLevel;
    }

    create() {
        this.input.addPointer(3); // รองรับมัลติทัชแน่นอน (สูงสุด 4 นิ้วรวมนิ้วแรก)
        this.isGameOver = false;
        this.enemiesKilled = 0;
        this.heartIcons = [];
        this.nextFireTime = 0; // Cooldown ปืนผู้เล่น

        // ตั้งค่าความยาก
        let diff = this.registry.get('difficulty') || 'medium';
        if (diff === 'easy') { this.playerHP = 5; this.enemySpeed = this.baseEnemySpeed * 0.7; this.enemyFireRate = this.baseEnemyFireRate * 1.5; } 
        else if (diff === 'hard') { this.playerHP = 2; this.enemySpeed = this.baseEnemySpeed * 1.3; this.enemyFireRate = this.baseEnemyFireRate * 0.7; } 
        else { this.playerHP = 3; this.enemySpeed = this.baseEnemySpeed; this.enemyFireRate = this.baseEnemyFireRate; }

        let bgColor, gridColor;
        switch(this.theme) {
            case 'forest': bgColor = 0x2d4c1e; gridColor = 0x1a3310; this.obstacleKey = 'tree'; break;
            case 'desert': bgColor = 0xd2b48c; gridColor = 0xb09571; this.obstacleKey = 'cactus'; break;
            case 'winter': bgColor = 0xe0f2fe; gridColor = 0xbddbf2; this.obstacleKey = 'snowman'; break;
            case 'fire': bgColor = 0x3a0000; gridColor = 0x1a0000; this.obstacleKey = 'rock_fire'; break;
            case 'rain': bgColor = 0x1a2a3a; gridColor = 0x0a1a2a; this.obstacleKey = 'tree'; break;
            case 'mountain': bgColor = 0x5a5a5a; gridColor = 0x3a3a3a; this.obstacleKey = 'rock_mountain'; break;
            case 'city': bgColor = 0x2b2b2b; gridColor = 0x111111; this.obstacleKey = 'wall_city'; break;
            case 'ruins': bgColor = 0x3a4a3a; gridColor = 0x1a2a1a; this.obstacleKey = 'ruins_pillar'; break;
            case 'swamp': bgColor = 0x1b2b1b; gridColor = 0x0b1b0b; this.obstacleKey = 'swamp_log'; break;
            case 'crystal': bgColor = 0x1a0b2e; gridColor = 0x0a0514; this.obstacleKey = 'crystal_node'; break;
        }

        this.add.grid(400, 300, 800, 600, 50, 50, bgColor, 1, gridColor, 0.5);

        if (this.theme === 'rain') {
            this.add.particles(400, 0, 'raindrop', {
                x: { min: 0, max: 800 }, y: { min: -50, max: 0 },
                lifespan: 1500, speedY: { min: 400, max: 600 }, scale: { start: 1, end: 0.5 }, quantity: 4, blendMode: 'ADD'
            }).setDepth(5);
        }

        this.walls = this.physics.add.staticGroup();
        this.obstacles = this.physics.add.staticGroup();
        this.items = this.physics.add.staticGroup(); 
        this.enemies = this.physics.add.group();
        
        this.player = this.physics.add.image(0, 0, 'tank_player');
        this.player.setCollideWorldBounds(true);
        this.player.setDepth(10);

        this.buildMap();

        this.uiText = this.add.text(20, 15, '', { fontFamily: '"Kanit", sans-serif', fontSize: '20px', fill: '#fff', stroke: '#000', strokeThickness: 4 });
        this.uiText.setDepth(20);
        this.updateUI();

        this.bullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 30, runChildUpdate: true });
        this.enemyBullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 50, runChildUpdate: true });
        this.cursors = this.input.keyboard.addKeys({ W: 87, A: 65, S: 83, D: 68, SPACE: 32 });

        this.setupMobileControls();

        let blockers = [this.walls, this.obstacles];
        this.physics.add.collider(this.player, blockers);
        this.physics.add.collider(this.enemies, blockers);
        this.physics.add.collider(this.enemies, this.enemies);
        this.physics.add.collider(this.bullets, blockers, this.hitWall, null, this);
        this.physics.add.collider(this.enemyBullets, blockers, this.hitWall, null, this);
        this.physics.add.overlap(this.bullets, this.enemies, this.hitEnemy, null, this);
        this.physics.add.overlap(this.enemyBullets, this.player, this.hitPlayer, null, this);
        this.physics.add.overlap(this.player, this.items, this.collectItem, null, this);

        this.enemyShootTimer = this.time.addEvent({ delay: this.enemyFireRate, callback: this.enemyShoot, callbackScope: this, loop: true });
    }

    setupMobileControls() {
        this.joyBase = this.add.circle(0, 0, 50, 0x444444, 0.5).setDepth(100).setScrollFactor(0).setVisible(false);
        this.joyThumb = this.add.circle(0, 0, 25, 0xaaaaaa, 0.8).setDepth(101).setScrollFactor(0).setVisible(false);
        this.joyActive = false;
        this.joyPointerId = null;
        this.joyVector = new Phaser.Math.Vector2(0, 0);

        this.input.on('pointerdown', (pointer) => {
            if (this.isGameOver) return; 
            
            // แตะครึ่งซ้าย = เดิน
            if (pointer.x < 400) { 
                if (!this.joyActive) {
                    this.joyActive = true;
                    this.joyPointerId = pointer.id;
                    this.joyBase.setPosition(pointer.x, pointer.y).setVisible(true);
                    this.joyThumb.setPosition(pointer.x, pointer.y).setVisible(true);
                    this.joyVector.set(0, 0);
                }
            } 
            // แตะครึ่งขวา = ยิงปืนทันที
            else { 
                this.shoot(pointer);
            }
        });

        this.input.on('pointermove', (pointer) => {
            if (this.isGameOver) return;
            
            // ลากจอยสติ๊กซ้าย
            if (this.joyActive && pointer.id === this.joyPointerId) {
                let dist = Phaser.Math.Distance.Between(this.joyBase.x, this.joyBase.y, pointer.x, pointer.y);
                let maxDist = 50;
                let angle = Phaser.Math.Angle.Between(this.joyBase.x, this.joyBase.y, pointer.x, pointer.y);
                
                if (dist > maxDist) dist = maxDist;
                
                this.joyThumb.x = this.joyBase.x + Math.cos(angle) * dist;
                this.joyThumb.y = this.joyBase.y + Math.sin(angle) * dist;
                
                this.joyVector.x = (dist / maxDist) * Math.cos(angle);
                this.joyVector.y = (dist / maxDist) * Math.sin(angle);
            } 
            // ลากนิ้วครึ่งขวา = หันปืนตามนิ้ว และยิงรัว (ถ้ากดค้าง)
            else if (pointer.isDown && pointer.x >= 400 && pointer.id !== this.joyPointerId) {
                let angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, pointer.x, pointer.y);
                this.player.setRotation(angle);
                this.shoot(pointer);
            }
        });

        const releaseJoy = (pointer) => {
            if (this.joyActive && pointer.id === this.joyPointerId) {
                this.joyActive = false;
                this.joyPointerId = null;
                this.joyBase.setVisible(false);
                this.joyThumb.setVisible(false);
                this.joyVector.set(0, 0);
            }
        };

        this.input.on('pointerup', releaseJoy);
        this.input.on('pointerout', releaseJoy);
    }

    setupEnemyAI(enemy) {
        // กำหนดมุมเริ่มต้นแบบสุ่ม
        enemy.setData('targetAngle', Phaser.Math.FloatBetween(-Math.PI, Math.PI));
        
        // Timer ให้ศัตรูเปลี่ยนทิศทางทุกๆ 1.5 - 3 วินาที
        let moveTimer = this.time.addEvent({
            delay: Phaser.Math.Between(1500, 3000),
            callback: () => {
                if (enemy && enemy.active && this.player && this.player.active) {
                    // สุ่ม 40% หันหาผู้เล่นเพื่อจะยิง, 60% เดินลาดตระเวนสุ่มทิศทาง
                    if (Phaser.Math.Between(1, 100) <= 40) {
                        enemy.setData('targetAngle', Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player.y));
                    } else {
                        enemy.setData('targetAngle', Phaser.Math.FloatBetween(-Math.PI, Math.PI));
                    }
                }
            },
            loop: true
        });
        enemy.setData('moveTimer', moveTimer);
    }

    buildMap() {
        const tileSize = 50;
        for (let row = 0; row < this.mapLayout.length; row++) {
            for (let col = 0; col < this.mapLayout[row].length; col++) {
                let char = this.mapLayout[row][col];
                let x = col * tileSize + (tileSize / 2);
                let y = row * tileSize + (tileSize / 2);

                if (char === 'W') this.walls.create(x, y, 'wall_normal');
                else if (char === 'O') {
                    let obs = this.obstacles.create(x, y, this.obstacleKey);
                    obs.body.setSize(35, 35);
                }
                else if (char === 'P') this.player.setPosition(x, y);
                else if (char === 'E') {
                    let enemy = this.enemies.create(x, y, 'tank_enemy');
                    enemy.setCollideWorldBounds(true); enemy.setBounce(0.8);
                    this.setupEnemyAI(enemy);
                }
                else if (char === 'B') {
                    let boss = this.enemies.create(x, y, 'tank_boss');
                    boss.setCollideWorldBounds(true); boss.setBounce(0.8);
                    boss.setData('isBoss', true); boss.setData('hp', 15);
                    this.setupEnemyAI(boss);
                }
                else if (char === 'H') this.items.create(x, y, 'medkit');
            }
        }
    }

    update() {
        if (this.isGameOver) return;
        this.player.setVelocity(0);

        let speed = 200;
        let vx = 0; let vy = 0;

        // คีย์บอร์ด
        if (this.cursors.W.isDown) vy -= speed;
        if (this.cursors.S.isDown) vy += speed;
        if (this.cursors.A.isDown) vx -= speed;
        if (this.cursors.D.isDown) vx += speed;

        // จอยสติ๊กซ้าย
        if (this.joyActive) {
            vx = this.joyVector.x * speed;
            vy = this.joyVector.y * speed;
        }
        this.player.setVelocity(vx, vy);

        // หันรถถังตามเมาส์บน Desktop
        if (this.sys.game.device.os.desktop) {
            let pointer = this.input.activePointer;
            let angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, pointer.x, pointer.y);
            this.player.setRotation(angle);
        }

        // ยิงด้วยปุ่ม Spacebar
        if (this.cursors.SPACE && Phaser.Input.Keyboard.JustDown(this.cursors.SPACE)) {
            this.shoot(this.input.activePointer);
        }

        // ศัตรูหันหน้าและเดินตามเป้าหมาย (targetAngle) ที่ AI ลาดตระเวนกำหนดไว้
        this.enemies.children.iterate((enemy) => {
            if(enemy && enemy.active) {
                let targetAngle = enemy.getData('targetAngle');
                enemy.rotation = Phaser.Math.Angle.RotateTo(enemy.rotation, targetAngle, 0.04); // ค่อยๆ หัน
                this.physics.velocityFromRotation(enemy.rotation, this.enemySpeed, enemy.body.velocity); // เดินไปด้านหน้า
            }
        });
    }

    updateUI() {
        let totalScore = this.registry.get('totalScore');
        let diffStr = this.registry.get('difficulty');
        let diffTh = diffStr === 'easy' ? 'ง่าย' : (diffStr === 'hard' ? 'ยาก' : 'ปานกลาง');

        const thNames = { 'forest':'ป่าไม้', 'desert':'ทะเลทราย', 'winter':'หิมะ', 'fire':'ลาวา', 'rain':'ฝน', 'mountain':'ภูเขา', 'city':'เมือง', 'ruins':'ซากปรักหักพัง', 'swamp':'หนองน้ำ', 'crystal':'คริสตัล' };
        let themeName = thNames[this.theme] || this.theme;

        this.uiText.setText(`[${diffTh}] ด่าน ${this.levelNum}/10 (${themeName}) | คะแนน: ${totalScore} | พลัง:`);
        
        this.heartIcons.forEach(h => h.destroy());
        this.heartIcons = [];
        let startX = this.uiText.x + this.uiText.width + 10;
        for(let i = 0; i < this.playerHP; i++) {
            let heart = this.add.image(startX + (i * 25), 25, 'heart').setScale(0.8);
            heart.setDepth(20);
            this.heartIcons.push(heart);
        }
    }

    shoot(pointer) {
        if (this.isGameOver || !this.player.active) return;
        
        // หันหน้ารถถังไปที่นิ้วเสมอเมื่อกดยิงบนมือถือ
        let angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, pointer.x, pointer.y);
        this.player.setRotation(angle);

        // Cooldown 250ms ป้องกันการยิงรัวเกินไป
        if (this.time.now < this.nextFireTime) return;
        this.nextFireTime = this.time.now + 250;

        let bullet = this.bullets.get(this.player.x, this.player.y, 'bullet');
        if (bullet) {
            try { this.sound.play('shoot', { volume: 0.3 }); } catch(e){}
            bullet.setActive(true).setVisible(true); 
            bullet.enableBody(true, this.player.x, this.player.y, true, true);
            
            bullet.setRotation(angle); 
            bullet.x += Math.cos(angle) * 35; // ยิงออกจากปากกระบอก
            bullet.y += Math.sin(angle) * 35;
            this.physics.velocityFromRotation(angle, 700, bullet.body.velocity);

            // ป้องกันกระสุนค้างในระบบ (ทำลายกระสุนทิ้งหากลอยออกไปนานเกิน 1.5 วินาที)
            this.time.delayedCall(1500, () => {
                if (bullet && bullet.active) bullet.disableBody(true, true);
            });
        }
    }

    enemyShoot() {
        if (this.isGameOver || !this.player.active) return;
        this.enemies.children.iterate((enemy) => {
            if (enemy.active) {
                let distance = Phaser.Math.Distance.Between(enemy.x, enemy.y, this.player.x, this.player.y);
                if(distance < 500) { 
                    let angleToPlayer = Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player.y);
                    let enemyRotation = enemy.rotation;
                    let diffAngle = Phaser.Math.Angle.Wrap(angleToPlayer - enemyRotation);

                    // ยิงเฉพาะเมื่อหันปากกระบอกปืนตรงกับผู้เล่น (มุมห่างไม่เกิน ~11 องศา)
                    if (Math.abs(diffAngle) < 0.2) {
                        let bullet = this.enemyBullets.get(enemy.x, enemy.y, 'enemy_bullet');
                        if (bullet) {
                            try { this.sound.play('shoot', { volume: 0.1 }); } catch(e){}
                            bullet.setActive(true).setVisible(true); 
                            bullet.enableBody(true, enemy.x, enemy.y, true, true);
                            
                            // ยิงกระสุนพุ่งออกไปตามมุมด้านหน้าของศัตรูเท่านั้น
                            bullet.setRotation(enemyRotation); 
                            bullet.x += Math.cos(enemyRotation) * 35; 
                            bullet.y += Math.sin(enemyRotation) * 35;
                            this.physics.velocityFromRotation(enemyRotation, 400, bullet.body.velocity);

                            // ป้องกันกระสุนค้างในระบบ
                            this.time.delayedCall(2000, () => {
                                if (bullet && bullet.active) bullet.disableBody(true, true);
                            });
                        }
                    }
                }
            }
        });
    }

    createExplosion(x, y, color, size = 1.5) {
        let emitter = this.add.particles(x, y, 'particle', {
            speed: { min: 80, max: 250 }, angle: { min: 0, max: 360 }, scale: { start: size, end: 0 }, lifespan: 600, quantity: 20, tint: color, blendMode: 'ADD'
        });
        emitter.explode();
    }

    hitWall(bullet, wall) {
        this.createExplosion(bullet.x, bullet.y, 0xaaaaaa, 1);
        bullet.disableBody(true, true);
    }

    hitEnemy(bullet, enemy) {
        bullet.disableBody(true, true);
        let isBoss = enemy.getData('isBoss');
        
        if (isBoss) {
            let hp = enemy.getData('hp') - 1;
            enemy.setData('hp', hp);
            enemy.setTint(0xffffff);
            this.time.delayedCall(100, () => { enemy.clearTint(); });
            if (hp > 0) {
                try { this.sound.play('explode', { volume: 0.2 }); } catch(e){}
                this.createExplosion(bullet.x, bullet.y, 0xffaa00, 1);
                return; 
            }
        }

        try { this.sound.play('explode', { volume: 0.6 }); } catch(e){}
        this.createExplosion(enemy.x, enemy.y, isBoss ? 0xcc00ff : 0xff3300, isBoss ? 3 : 1.5);
        
        // ลบ Timer ทิ้งเมื่อศัตรูตาย เพื่อไม่ให้ทำงานค้างในระบบ
        let moveTimer = enemy.getData('moveTimer');
        if (moveTimer) moveTimer.remove();

        enemy.disableBody(true, true);
        
        this.enemiesKilled++;
        this.registry.set('totalScore', this.registry.get('totalScore') + (isBoss ? 1000 : 100));
        this.updateUI();

        if (this.enemiesKilled >= this.targetScore) this.time.delayedCall(500, () => this.endLevel(true));
    }

    hitPlayer(player, bullet) {
        try { this.sound.play('explode', { volume: 0.5 }); } catch(e){}
        this.createExplosion(player.x, player.y, 0xffaa00);
        bullet.disableBody(true, true);
        
        this.playerHP--;
        this.updateUI();
        this.player.setTint(0xff0000);
        this.time.delayedCall(150, () => { this.player.clearTint(); });

        if (this.playerHP <= 0) {
            this.createExplosion(player.x, player.y, 0x00ff00, 2);
            player.disableBody(true, true);
            this.endLevel(false);
        }
    }

    collectItem(player, item) {
        try { this.sound.play('pickup', { volume: 0.6 }); } catch(e){}
        item.destroy(); 
        let diff = this.registry.get('difficulty');
        let maxHP = diff === 'easy' ? 8 : (diff === 'hard' ? 4 : 5);
        if(this.playerHP < maxHP) this.playerHP++;
        this.updateUI();
        this.createExplosion(item.x, item.y, 0x00ff00);
    }

    endLevel(isWin) {
        this.isGameOver = true;
        this.enemyShootTimer.remove();
        this.physics.pause();
        
        if(this.joyBase) this.joyBase.setVisible(false);
        if(this.joyThumb) this.joyThumb.setVisible(false);

        // หน้าต่าง Overlay แสดงความสำเร็จ
        let overlay = this.add.graphics();
        overlay.fillStyle(0x000000, 0.85);
        overlay.fillRect(0, 0, 800, 600);
        overlay.setDepth(100);

        let textStyle = { fontFamily: '"Kanit", sans-serif', fontSize: '50px', align: 'center', stroke: '#000', strokeThickness: 6 };

        if (isWin) {
            if (this.nextLevel) {
                // ปุ่มเซฟเกม อยู่ด้านบนสุด
                let saveBtn = this.add.text(400, 50, '[ บันทึกเกมและกลับเมนูหลัก ]', { ...textStyle, fontSize: '24px', fill: '#0ff', backgroundColor: '#114444', padding: { x: 20, y: 10 } }).setOrigin(0.5).setInteractive().setDepth(101);
                saveBtn.on('pointerdown', () => {
                    let saveData = { level: this.nextLevel, score: this.registry.get('totalScore'), difficulty: this.registry.get('difficulty') || 'medium' };
                    localStorage.setItem('shogunTankSave', JSON.stringify(saveData));
                    saveBtn.setText('บันทึกสำเร็จ!'); saveBtn.setBackgroundColor('#144111');
                    this.time.delayedCall(800, () => { this.scene.start('MainMenu'); });
                });

                // ข้อความกลางจอ
                this.add.text(400, 250, 'ยินดีด้วย!\nเคลียร์ด่านสำเร็จ', { ...textStyle, fill: '#0f0' }).setOrigin(0.5).setDepth(101);
                
                // ปุ่มไปต่อตรงกลาง
                let nextBtn = this.add.text(400, 400, '>> ไปด่านถัดไป <<', { ...textStyle, fontSize: '36px', fill: '#fff', backgroundColor: '#222', padding: { x: 30, y: 15 } }).setOrigin(0.5).setInteractive().setDepth(101);
                nextBtn.on('pointerover', () => nextBtn.setBackgroundColor('#444'));
                nextBtn.on('pointerout', () => nextBtn.setBackgroundColor('#222'));
                nextBtn.on('pointerdown', () => { this.scene.start(this.nextLevel); });
            } else {
                // จบเกมเคลียร์ 10 ด่าน
                this.add.text(400, 250, 'สุดยอด!\nคุณเคลียร์ครบ 10 ด่านแล้ว\nคุณคือแชมเปี้ยน!', { ...textStyle, fill: '#ff0' }).setOrigin(0.5).setDepth(101);
                localStorage.removeItem('shogunTankSave');
                let endBtn = this.add.text(400, 420, 'กลับเมนูหลัก', { ...textStyle, fontSize: '30px', fill: '#fff', backgroundColor: '#222', padding: { x: 20, y: 10 } }).setOrigin(0.5).setInteractive().setDepth(101);
                endBtn.on('pointerdown', () => { this.registry.set('totalScore', 0); this.scene.start('MainMenu'); });
            }
        } else {
            // แพ้
            this.add.text(400, 280, 'รถถังถูกทำลาย!\nคลิกเพื่อกลับไปเมนูหลัก', { ...textStyle, fill: '#f00' }).setOrigin(0.5).setDepth(101);
            let retryBtn = this.add.text(400, 420, 'กลับเมนูหลัก', { ...textStyle, fontSize: '30px', fill: '#fff', backgroundColor: '#222', padding: { x: 20, y: 10 } }).setOrigin(0.5).setInteractive().setDepth(101);
            retryBtn.on('pointerdown', () => { this.registry.set('totalScore', 0); this.scene.start('MainMenu'); });
        }
    }
}

// W=กำแพง, O=สิ่งกีดขวาง, P=ผู้เล่น, E=ศัตรู, B=บอส, H=เลือด

class Level4 extends BaseLevel { constructor() { super('Level4'); } create() { const map = [ 'WWWWWWWWWWWWWWWW', 'W.H.O...E...O..W', 'W...O.E.....O..W', 'WOOOO...P...OOOW', 'W..............W', 'W...E.....E....W', 'W..............W', 'WOOOO.......OOOW', 'W...O.E.....O.HW', 'W...O...E...O..W', 'W..............W', 'WWWWWWWWWWWWWWWW' ]; this.initData(4, 'fire', map, 6, 130, 1300, 'Level5'); super.create(); } }

class Level6 extends BaseLevel { constructor() { super('Level6'); } create() { const map = [ 'WWWWWWWWWWWWWWWW', 'WOOE...E.....OOW', 'WO...........OOW', 'W...W.....W....W', 'W...W..P..W..H.W', 'W...W.....W....W', 'W...W.....W....W', 'W.H.W.....W....W', 'WO...........OOW', 'WOO..E...E...OOW', 'WOOE.......E.OOW', 'WWWWWWWWWWWWWWWW' ]; this.initData(6, 'mountain', map, 6, 140, 1200, 'Level7'); super.create(); } }
class Level7 extends BaseLevel { constructor() { super('Level7'); } create() { const map = [ 'WWWWWWWWWWWWWWWW', 'W.E..W..H..W..EW', 'W....W.....W...W', 'WW.WWWW...WWWW.W', 'W..............W', 'W.......P......W', 'W..............W', 'WW.WWWW...WWWW.W', 'W....W.....W...W', 'W.E..W..E..W..EW', 'W.H............W', 'WWWWWWWWWWWWWWWW' ]; this.initData(7, 'city', map, 6, 150, 1100, 'Level8'); super.create(); } }
class Level8 extends BaseLevel { constructor() { super('Level8'); } create() { const map = [ 'WWWWWWWWWWWWWWWW', 'W.E.O.E.O.E.O.EW', 'W.O.O.O.O.O.O.OW', 'W.H..........H.W', 'WO............OW', 'W......P.......W', 'WO............OW', 'W..............W', 'W.O.O.O.O.O.O.OW', 'W.E.O.E.O.E.O.EW', 'W..............W', 'WWWWWWWWWWWWWWWW' ]; this.initData(8, 'ruins', map, 8, 160, 1000, 'Level9'); super.create(); } }
class Level9 extends BaseLevel { constructor() { super('Level9'); } create() { const map = [ 'WWWWWWWWWWWWWWWW', 'WOE...E...E...EW', 'W.OOOOOOOOOOOO.W', 'W.O.H......H.O.W', 'W.O..........O.W', 'W.O....P.....O.W', 'W.O..........O.W', 'W.O..........O.W', 'W.OOOOOOOOOOOO.W', 'WOE...E...E...EW', 'W..............W', 'WWWWWWWWWWWWWWWW' ]; this.initData(9, 'swamp', map, 8, 170, 900, 'Level10'); super.create(); } }
class Level10 extends BaseLevel{ constructor() { super('Level10');} create() { const map = [ 'WWWWWWWWWWWWWWWW', 'W...E...B...E..W', 'W.O...H...H..O.W', 'W.OO.......OO..W', 'W..............W', 'W......P.......W', 'W..............W', 'W.OO.......OO..W', 'W.O...H...H..O.W', 'W...E...B...E..W', 'W..............W', 'WWWWWWWWWWWWWWWW' ]; this.initData(10, 'crystal', map, 6, 150, 900, null); super.create(); } } // Boss 2

const config = {
    type: Phaser.AUTO, 
    width: 800, height: 600,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 800, height: 600 },
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: [BootScene, MainMenu, DifficultyMenu, Level1, Level2, Level3, Level4, Level5, Level6, Level7, Level8, Level9, Level10]
};
const game = new Phaser.Game(config);
