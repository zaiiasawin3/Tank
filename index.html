<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>รถถังโชกุน - Complete Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        body { margin: 0; background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Kanit', sans-serif; }
        canvas { box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
    </style>
</head>
<body>
<script>
// ================= ข้อมูลด่านทั้ง 10 ด่าน =================
const LEVELS = [
    { name: 'ป่าไม้', bgColor: 0x2d4c1e, gridColor: 0x1a3310, obsKey: 'tree', enemies: 4, speed: 100, boss: false },
    { name: 'ทะเลทราย', bgColor: 0xd2b48c, gridColor: 0xb09571, obsKey: 'cactus', enemies: 5, speed: 110, boss: false },
    { name: 'ฤดูหนาว', bgColor: 0xe0f2fe, gridColor: 0xbddbf2, obsKey: 'snowman', enemies: 6, speed: 120, boss: false },
    { name: 'ภูเขาไฟ', bgColor: 0x5c1e1e, gridColor: 0x3d1010, obsKey: 'wall_normal', enemies: 7, speed: 130, boss: false },
    { name: 'ฐานทัพบอส 1', bgColor: 0x222222, gridColor: 0x111111, obsKey: 'wall_normal', enemies: 4, speed: 140, boss: true },
    { name: 'พายุฝน', bgColor: 0x3a4a5a, gridColor: 0x2a3a4a, obsKey: 'tree', enemies: 7, speed: 130, boss: false },
    { name: 'หุบเขา', bgColor: 0x6e6354, gridColor: 0x52493d, obsKey: 'cactus', enemies: 8, speed: 140, boss: false },
    { name: 'เมืองร้าง', bgColor: 0x444444, gridColor: 0x333333, obsKey: 'wall_normal', enemies: 9, speed: 150, boss: false },
    { name: 'หนองน้ำมรณะ', bgColor: 0x1e3626, gridColor: 0x122418, obsKey: 'tree', enemies: 10, speed: 160, boss: false },
    { name: 'รังบอสใหญ่', bgColor: 0x1a0a2a, gridColor: 0x0a0514, obsKey: 'wall_normal', enemies: 6, speed: 150, boss: true }
];

const DEFAULT_MAP = [
    'WWWWWWWWWWWWWWWW',
    'W..H....O......W',
    'W..WWW....WWW..W',
    'W......O.......W',
    'W..............W',
    'W..O....P...O..W',
    'W..............W',
    'W......O.......W',
    'W..WWW....WWW..W',
    'W......O....H..W',
    'W..............W',
    'WWWWWWWWWWWWWWWW'
];

class BootScene extends Phaser.Scene {
    constructor() { super('Boot'); }
    preload() {
        this.load.audio('shoot', 'https://labs.phaser.io/assets/audio/SoundEffects/blaster.mp3');
        this.load.audio('explode', 'https://labs.phaser.io/assets/audio/SoundEffects/explosion.mp3');
        this.load.audio('pickup', 'https://labs.phaser.io/assets/audio/SoundEffects/pickup.mp3');
    }
    create() {
        if(!localStorage.getItem('tankKeys')) {
            localStorage.setItem('tankKeys', JSON.stringify({ up: 87, down: 83, left: 65, right: 68, shoot: 32 })); // Default WASD + Space
        }
        
        let g = this.add.graphics();
        // Player Tank
        g.clear(); g.fillStyle(0x111111); g.fillRect(5, 2, 40, 10); g.fillRect(5, 28, 40, 10); g.fillStyle(0x2d5a27); g.fillRoundedRect(10, 8, 36, 24, 4); g.fillStyle(0x111111); g.fillRect(28, 17, 30, 6); g.generateTexture('tank_player', 64, 40);
        // Enemy Tank
        g.clear(); g.fillStyle(0x111111); g.fillRect(5, 2, 40, 10); g.fillRect(5, 28, 40, 10); g.fillStyle(0x8a2525); g.fillRoundedRect(10, 8, 36, 24, 4); g.fillStyle(0x111111); g.fillRect(28, 17, 30, 6); g.generateTexture('tank_enemy', 64, 40);
        // Boss Tank
        g.clear(); g.fillStyle(0x111111); g.fillRect(5, 2, 60, 14); g.fillRect(5, 44, 60, 14); g.fillStyle(0x311b5e); g.fillRoundedRect(15, 12, 50, 36, 6); g.fillStyle(0x111111); g.fillRect(40, 26, 45, 8); g.generateTexture('tank_boss', 90, 60);
        
        // Props & Items
        g.clear(); g.fillStyle(0x4a4a4a); g.fillRect(0, 0, 50, 50); g.lineStyle(2, 0x222222); g.strokeRect(0, 0, 50, 50); g.generateTexture('wall_normal', 50, 50);
        g.clear(); g.fillStyle(0xff2222); g.fillCircle(10, 10, 6); g.fillCircle(20, 10, 6); g.fillTriangle(4, 12, 26, 12, 15, 25); g.generateTexture('heart', 30, 30);
        g.clear(); g.fillStyle(0x1a4314); g.fillCircle(25, 25, 22); g.generateTexture('tree', 50, 50);
        g.clear(); g.fillStyle(0x28681e); g.fillRoundedRect(15, 5, 20, 40, 10); g.generateTexture('cactus', 50, 50);
        g.clear(); g.fillStyle(0xeeeeee); g.fillCircle(25, 35, 15); g.fillCircle(25, 15, 10); g.generateTexture('snowman', 50, 50);
        g.clear(); g.fillStyle(0xdddddd); g.fillRoundedRect(0, 0, 26, 26, 4); g.fillStyle(0xcc0000); g.fillRect(10, 4, 6, 18); g.fillRect(4, 10, 18, 6); g.generateTexture('medkit', 26, 26);
        g.clear(); g.fillStyle(0xffff00); g.fillRoundedRect(0, 0, 14, 6, 3); g.generateTexture('bullet', 14, 6);
        g.clear(); g.fillStyle(0xff5500); g.fillRoundedRect(0, 0, 14, 6, 3); g.generateTexture('enemy_bullet', 14, 6);
        g.clear(); g.fillStyle(0xffaa00); g.fillRect(0, 0, 6, 6); g.generateTexture('particle', 6, 6);

        this.scene.start('MainMenu');
    }
}

class MainMenu extends Phaser.Scene {
    constructor() { super('MainMenu'); }
    create() {
        this.add.text(400, 150, 'รถถังโชกุน', { fontFamily: 'Kanit', fontSize: '80px', fill: '#0f0', stroke: '#000', strokeThickness: 8 }).setOrigin(0.5);
        
        let startBtn = this.createButton(400, 300, 'เริ่มเกมใหม่', () => {
            this.registry.set('totalScore', 0);
            this.scene.start('GameLevel', { level: 1, hp: 3 });
        });

        if (localStorage.getItem('shogunTankSave')) {
            this.createButton(400, 400, 'เล่นต่อจากด่านที่เซฟ', () => {
                let save = JSON.parse(localStorage.getItem('shogunTankSave'));
                this.registry.set('totalScore', save.score);
                this.scene.start('GameLevel', { level: save.level, hp: save.hp });
            });
        }

        this.createButton(400, 500, 'ตั้งค่าปุ่มควบคุม', () => {
            this.scene.start('SettingsMenu');
        });
    }

    createButton(x, y, text, callback) {
        let btn = this.add.text(x, y, text, { fontFamily: 'Kanit', fontSize: '32px', fill: '#fff', backgroundColor: '#333', padding: { x: 20, y: 10 } }).setOrigin(0.5).setInteractive();
        btn.on('pointerover', () => btn.setStyle({ fill: '#ff0' }));
        btn.on('pointerout', () => btn.setStyle({ fill: '#fff' }));
        btn.on('pointerdown', callback);
        return btn;
    }
}

class SettingsMenu extends Phaser.Scene {
    constructor() { super('SettingsMenu'); }
    create() {
        this.keys = JSON.parse(localStorage.getItem('tankKeys'));
        this.add.text(400, 100, 'ตั้งค่าปุ่ม (คลิกที่ปุ่มเพื่อเปลี่ยน)', { fontFamily: 'Kanit', fontSize: '40px', fill: '#fff' }).setOrigin(0.5);

        this.createKeySet(250, 'เดินขึ้น', 'up');
        this.createKeySet(330, 'เดินลง', 'down');
        this.createKeySet(410, 'เดินซ้าย', 'left');
        this.createKeySet(490, 'เดินขวา', 'right');
        this.createKeySet(570, 'ยิง', 'shoot');

        let backBtn = this.add.text(400, 650, 'บันทึกและกลับ', { fontFamily: 'Kanit', fontSize: '30px', fill: '#0f0', backgroundColor: '#222', padding: {x:15, y:10} }).setOrigin(0.5).setInteractive();
        backBtn.on('pointerdown', () => {
            localStorage.setItem('tankKeys', JSON.stringify(this.keys));
            this.scene.start('MainMenu');
        });
    }

    createKeySet(y, label, keyName) {
        this.add.text(300, y, label, { fontFamily: 'Kanit', fontSize: '28px', fill: '#aaa' }).setOrigin(1, 0.5);
        let btn = this.add.text(450, y, this.getKeyChar(this.keys[keyName]), { fontFamily: 'Kanit', fontSize: '28px', fill: '#fff', backgroundColor: '#444', padding: {x:20, y:5} }).setOrigin(0.5).setInteractive();
        
        btn.on('pointerdown', () => {
            btn.setText('กดปุ่มใหม่...');
            this.input.keyboard.once('keydown', (event) => {
                this.keys[keyName] = event.keyCode;
                btn.setText(this.getKeyChar(event.keyCode));
            });
        });
    }

    getKeyChar(keyCode) {
        if (keyCode === 32) return 'SPACE';
        if (keyCode === 37) return 'ARROW LEFT';
        if (keyCode === 38) return 'ARROW UP';
        if (keyCode === 39) return 'ARROW RIGHT';
        if (keyCode === 40) return 'ARROW DOWN';
        return String.fromCharCode(keyCode);
    }
}

class GameLevel extends Phaser.Scene {
    constructor() { super('GameLevel'); }

    init(data) {
        this.levelNum = data.level || 1;
        this.playerHP = data.hp || 3;
        this.levelData = LEVELS[this.levelNum - 1];
    }

    create() {
        this.isGameOver = false;
        this.enemiesKilled = 0;
        this.customKeys = JSON.parse(localStorage.getItem('tankKeys'));

        // Background
        this.add.grid(400, 300, 800, 600, 50, 50, this.levelData.bgColor, 1, this.levelData.gridColor, 0.5);

        // Groups
        this.walls = this.physics.add.staticGroup();
        this.obstacles = this.physics.add.staticGroup();
        this.items = this.physics.add.staticGroup(); 
        this.enemies = this.physics.add.group();
        
        this.player = this.physics.add.image(0, 0, 'tank_player');
        this.player.setCollideWorldBounds(true).setDepth(10);

        this.buildMap();

        // UI Top Left
        this.uiText = this.add.text(20, 15, '', { fontFamily: 'Kanit', fontSize: '22px', fill: '#fff', stroke: '#000', strokeThickness: 5 }).setDepth(20);
        this.heartIcons = [];
        this.updateUI();

        // UI Save Button (Top Right)
        let saveBtn = this.add.text(780, 15, '💾 บันทึกเกม', { fontFamily: 'Kanit', fontSize: '20px', fill: '#fff', backgroundColor: '#005500', padding: {x: 10, y: 5} }).setOrigin(1, 0).setInteractive().setDepth(20);
        saveBtn.on('pointerdown', () => this.saveGame());

        this.bullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 30, runChildUpdate: true });
        this.enemyBullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: 50, runChildUpdate: true });
        
        // Shoot Key
        this.input.keyboard.on(`keydown-${this.customKeys.shoot}`, () => this.shoot());
        this.input.keyboard.on('keydown-SPACE', () => this.shoot()); // Fallback space
        
        // Mouse/Touch shoot (Optional: anywhere on screen)
        this.input.on('pointerdown', () => this.shoot());

        // Colliders
        let blockers = [this.walls, this.obstacles];
        this.physics.add.collider(this.player, blockers);
        this.physics.add.collider(this.enemies, blockers);
        this.physics.add.collider(this.enemies, this.enemies);
        this.physics.add.collider(this.bullets, blockers, this.hitWall, null, this);
        this.physics.add.collider(this.enemyBullets, blockers, this.hitWall, null, this);
        this.physics.add.overlap(this.bullets, this.enemies, this.hitEnemy, null, this);
        this.physics.add.overlap(this.enemyBullets, this.player, this.hitPlayer, null, this);
        this.physics.add.overlap(this.player, this.items, this.collectItem, null, this);

        // AI Loop
        this.time.addEvent({ delay: 1000, callback: this.processEnemyAI, callbackScope: this, loop: true });
    }

    buildMap() {
        for (let row = 0; row < DEFAULT_MAP.length; row++) {
            for (let col = 0; col < DEFAULT_MAP[row].length; col++) {
                let char = DEFAULT_MAP[row][col];
                let x = col * 50 + 25; let y = row * 50 + 25;

                if (char === 'W') this.walls.create(x, y, 'wall_normal');
                else if (char === 'O') this.obstacles.create(x, y, this.levelData.obsKey).body.setSize(35, 35);
                else if (char === 'H') this.items.create(x, y, 'medkit');
                else if (char === 'P') this.player.setPosition(x, y);
            }
        }

        // Spawn Enemies randomly in empty spaces
        for(let i=0; i<this.levelData.enemies; i++) {
            let ex = Phaser.Math.Between(100, 700); let ey = Phaser.Math.Between(100, 500);
            let enemy = this.enemies.create(ex, ey, 'tank_enemy');
            enemy.setCollideWorldBounds(true).setBounce(1);
            enemy.setVelocity(Phaser.Math.Between(-this.levelData.speed, this.levelData.speed), Phaser.Math.Between(-this.levelData.speed, this.levelData.speed));
            enemy.setAngle(Phaser.Math.Between(0, 3) * 90);
        }

        if (this.levelData.boss) {
            let boss = this.enemies.create(400, 300, 'tank_boss');
            boss.setCollideWorldBounds(true).setBounce(1);
            boss.setData('isBoss', true); boss.setData('hp', 15);
        }
    }

    update() {
        if (this.isGameOver || !this.player.active) return;
        this.player.setVelocity(0);

        let k = this.customKeys;
        let isUp = this.input.keyboard.addKey(k.up).isDown || this.input.keyboard.addKey(38).isDown;
        let isDown = this.input.keyboard.addKey(k.down).isDown || this.input.keyboard.addKey(40).isDown;
        let isLeft = this.input.keyboard.addKey(k.left).isDown || this.input.keyboard.addKey(37).isDown;
        let isRight = this.input.keyboard.addKey(k.right).isDown || this.input.keyboard.addKey(39).isDown;

        // 4-Way Movement (No diagonal)
        if (isUp) {
            this.player.setVelocityY(-200); this.player.setAngle(-90);
        } else if (isDown) {
            this.player.setVelocityY(200); this.player.setAngle(90);
        } else if (isLeft) {
            this.player.setVelocityX(-200); this.player.setAngle(180);
        } else if (isRight) {
            this.player.setVelocityX(200); this.player.setAngle(0);
        }
    }

    updateUI() {
        let totalScore = this.registry.get('totalScore') || 0;
        this.uiText.setText(`ด่าน ${this.levelNum}/10 (${this.levelData.name}) | คะแนน: ${totalScore} | พลังชีวิต `);
        
        this.heartIcons.forEach(h => h.destroy());
        this.heartIcons = [];
        let startX = this.uiText.x + this.uiText.width + 5;
        for(let i=0; i<this.playerHP; i++) {
            this.heartIcons.push(this.add.image(startX + (i * 25), 28, 'heart').setDepth(20).setScale(0.8));
        }
    }

    shoot() {
        if (this.isGameOver || !this.player.active) return;
        let bullet = this.bullets.get(this.player.x, this.player.y, 'bullet');
        if (bullet) {
            try { this.sound.play('shoot', { volume: 0.3 }); } catch(e){}
            bullet.setActive(true).setVisible(true).enableBody(true, this.player.x, this.player.y, true, true);
            let angle = this.player.rotation; 
            bullet.setRotation(angle); 
            bullet.x += Math.cos(angle) * 35; bullet.y += Math.sin(angle) * 35;
            this.physics.velocityFromRotation(angle, 700, bullet.body.velocity);
            
            this.time.delayedCall(2000, () => { if(bullet.active) bullet.disableBody(true, true); });
        }
    }

    processEnemyAI() {
        if (this.isGameOver || !this.player.active) return;
        
        this.enemies.children.iterate((enemy) => {
            if (enemy && enemy.active) {
                // 1. ตรวจสอบระยะห่างจากผู้เล่น
                let distance = Phaser.Math.Distance.Between(enemy.x, enemy.y, this.player.x, this.player.y);
                
                // 2. ถ้าอยู่ใกล้ ให้หันหน้าและยิงตรงๆ ไปด้านหน้า
                if(distance < 400 && Phaser.Math.Between(0, 100) > 40) {
                    let angleToPlayer = Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player.y);
                    
                    // ปัดเศษองศาให้หันเป็น 4 ทิศทาง
                    let snapAngle = Math.round(angleToPlayer / (Math.PI/2)) * (Math.PI/2);
                    enemy.setRotation(snapAngle);
                    
                    let bullet = this.enemyBullets.get(enemy.x, enemy.y, 'enemy_bullet');
                    if (bullet) {
                        try { this.sound.play('shoot', { volume: 0.1 }); } catch(e){}
                        bullet.setActive(true).setVisible(true).enableBody(true, enemy.x, enemy.y, true, true);
                        bullet.setRotation(snapAngle); 
                        bullet.x += Math.cos(snapAngle) * 35; bullet.y += Math.sin(snapAngle) * 35;
                        this.physics.velocityFromRotation(snapAngle, 400, bullet.body.velocity);
                        
                        this.time.delayedCall(2000, () => { if(bullet.active) bullet.disableBody(true, true); });
                    }
                    // ยิงเสร็จสุ่มเดินหนี ไม่ให้เกาะกลุ่ม
                    enemy.setVelocity(Phaser.Math.Between(-this.levelData.speed, this.levelData.speed), Phaser.Math.Between(-this.levelData.speed, this.levelData.speed));
                } else {
                    // 3. ถ้าอยู่ไกล หรือสุ่มได้โหมดเดิน (Wander) ให้เดินสะเปะสะปะตาม 4 ทิศทาง
                    let dir = Phaser.Math.Between(0, 3) * (Math.PI/2);
                    enemy.setRotation(dir);
                    this.physics.velocityFromRotation(dir, this.levelData.speed, enemy.body.velocity);
                }
            }
        });
    }

    createExplosion(x, y, color, size = 1.5) {
        let emitter = this.add.particles(x, y, 'particle', { speed: { min: 80, max: 250 }, scale: { start: size, end: 0 }, lifespan: 600, quantity: 20, tint: color, blendMode: 'ADD' });
        emitter.explode();
    }

    hitWall(bullet, wall) {
        this.createExplosion(bullet.x, bullet.y, 0xaaaaaa, 1);
        bullet.disableBody(true, true);
    }

    hitEnemy(bullet, enemy) {
        bullet.disableBody(true, true);
        let isBoss = enemy.getData('isBoss');
        if (isBoss) {
            let hp = enemy.getData('hp') - 1;
            enemy.setData('hp', hp);
            enemy.setTint(0xffffff); this.time.delayedCall(100, () => enemy.clearTint());
            if (hp > 0) {
                try { this.sound.play('explode', { volume: 0.2 }); } catch(e){}
                this.createExplosion(bullet.x, bullet.y, 0xffaa00, 1);
                return; 
            }
        }

        try { this.sound.play('explode', { volume: 0.6 }); } catch(e){}
        this.createExplosion(enemy.x, enemy.y, isBoss ? 0xcc00ff : 0xff3300, isBoss ? 3 : 1.5);
        enemy.disableBody(true, true);
        
        this.enemiesKilled++;
        this.registry.set('totalScore', (this.registry.get('totalScore') || 0) + (isBoss ? 500 : 100));
        this.updateUI();

        if (this.enemiesKilled >= this.levelData.enemies + (this.levelData.boss ? 1 : 0)) {
            this.showOverlay(true);
        }
    }

    hitPlayer(player, bullet) {
        try { this.sound.play('explode', { volume: 0.5 }); } catch(e){}
        this.createExplosion(player.x, player.y, 0xffaa00);
        bullet.disableBody(true, true);
        
        this.playerHP--;
        this.updateUI();
        this.player.setTint(0xff0000); this.time.delayedCall(150, () => this.player.clearTint());

        if (this.playerHP <= 0) {
            this.createExplosion(player.x, player.y, 0x00ff00, 2);
            player.disableBody(true, true);
            this.showOverlay(false);
        }
    }

    collectItem(player, item) {
        try { this.sound.play('pickup', { volume: 0.6 }); } catch(e){}
        item.destroy(); 
        if(this.playerHP < 5) this.playerHP++;
        this.updateUI();
        this.createExplosion(item.x, item.y, 0x00ff00);
    }

    saveGame() {
        localStorage.setItem('shogunTankSave', JSON.stringify({
            level: this.levelNum, hp: this.playerHP, score: this.registry.get('totalScore')
        }));
        alert('บันทึกเกมสำเร็จ! (ด่าน ' + this.levelNum + ')');
        this.scene.start('MainMenu');
    }

    showOverlay(isWin) {
        this.isGameOver = true;
        this.physics.pause();
        
        // สร้างหน้าต่างโปร่งแสงสีดำทับ
        let bg = this.add.rectangle(400, 300, 800, 600, 0x000000, 0.7).setDepth(100);
        
        if (isWin) {
            if (this.levelNum < 10) {
                this.add.text(400, 250, '🎉 ยินดีด้วย ผ่านด่านแล้ว! 🎉', { fontFamily: 'Kanit', fontSize: '50px', fill: '#0f0', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setDepth(101);
                
                let nextBtn = this.add.text(400, 350, 'เล่นด่านถัดไป ➔', { fontFamily: 'Kanit', fontSize: '30px', fill: '#fff', backgroundColor: '#0066cc', padding: {x: 20, y: 10} }).setOrigin(0.5).setInteractive().setDepth(101);
                nextBtn.on('pointerdown', () => this.scene.restart({ level: this.levelNum + 1, hp: this.playerHP }));
            } else {
                this.add.text(400, 250, '🏆 เคลียร์เกมสำเร็จ! 🏆\nคุณคือสุดยอดโชกุน', { fontFamily: 'Kanit', fontSize: '50px', fill: '#ff0', align: 'center', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setDepth(101);
                
                let menuBtn = this.add.text(400, 380, 'กลับเมนูหลัก', { fontFamily: 'Kanit', fontSize: '30px', fill: '#fff', backgroundColor: '#444', padding: {x: 20, y: 10} }).setOrigin(0.5).setInteractive().setDepth(101);
                menuBtn.on('pointerdown', () => this.scene.start('MainMenu'));
            }
        } else {
            this.add.text(400, 250, '💀 รถถังถูกทำลาย 💀', { fontFamily: 'Kanit', fontSize: '50px', fill: '#f00', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setDepth(101);
            
            let retryBtn = this.add.text(400, 350, 'ลองใหม่อีกครั้ง ↻', { fontFamily: 'Kanit', fontSize: '30px', fill: '#fff', backgroundColor: '#880000', padding: {x: 20, y: 10} }).setOrigin(0.5).setInteractive().setDepth(101);
            retryBtn.on('pointerdown', () => this.scene.restart({ level: this.levelNum, hp: 3 }));
            
            let menuBtn = this.add.text(400, 420, 'กลับเมนูหลัก', { fontFamily: 'Kanit', fontSize: '24px', fill: '#aaa' }).setOrigin(0.5).setInteractive().setDepth(101);
            menuBtn.on('pointerdown', () => this.scene.start('MainMenu'));
        }
    }
}

const config = {
    type: Phaser.AUTO,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, width: 800, height: 600 },
    physics: { default: 'arcade', arcade: { debug: false } },
    scene: [BootScene, MainMenu, SettingsMenu, GameLevel]
};
const game = new Phaser.Game(config);
</script>
</body>
